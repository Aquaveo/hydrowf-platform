name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the real tool CWLs for the integration tests (tests/test_hydrowf_tools.py)
      - uses: actions/checkout@v4
        with:
          repository: Aquaveo/hydrowf-tools
          path: hydrowf-tools
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.12 pytest -v
        env:
          HYDROWF_TOOLS: ${{ github.workspace }}/hydrowf-tools
